<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Atendimento – CRM</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    :root{--bg:#0f0a00;--bg2:#1a1200;--bg3:#221800;--card:#1f1500;--border:#3d2e00;--acc:#f97316;--acc-dark:#ea6c0a;--acc-pale:#3a1f00;--acc-text:#fdba74;--text:#f0e8d8;--text-muted:#8a7a60;--danger:#ef4444;--danger-bg:#2a0d0d;--radius:12px;--sw:240px;--swc:60px;}
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
    a{text-decoration:none;color:inherit;}
    .sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--sw);background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:100;transition:width .25s;overflow:hidden;}
    .sidebar.col{width:var(--swc);}
    .sb-top{padding:16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);min-height:60px;gap:8px;}
    .sb-brand{display:flex;align-items:center;gap:10px;overflow:hidden;flex:1;}
    .sb-icon{width:32px;height:32px;background:var(--acc);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;}
    .sb-name{font-size:14px;font-weight:700;white-space:nowrap;transition:opacity .2s;}
    .sb-name span{color:var(--acc);}
    .btn-tog{background:none;border:1px solid var(--border);color:var(--text-muted);width:28px;height:28px;border-radius:6px;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;}
    .btn-tog:hover{border-color:var(--acc);color:var(--acc);}
    .sb-nav{padding:10px 8px;flex:1;}
    .nav-i{display:flex;align-items:center;gap:12px;padding:10px;border-radius:8px;font-size:13px;font-weight:500;color:var(--text-muted);cursor:pointer;transition:all .2s;white-space:nowrap;}
    .nav-i:hover{background:var(--bg3);color:var(--text);}
    .nav-i.on{background:var(--acc-pale);color:var(--acc-text);border-left:3px solid var(--acc);}
    .nav-ic{font-size:17px;flex-shrink:0;width:20px;text-align:center;}
    .nav-lbl{overflow:hidden;transition:opacity .15s,width .15s;}
    .sidebar.col .nav-lbl,.sidebar.col .sb-name{opacity:0;width:0;}
    .sidebar.col .nav-i{justify-content:center;}
    .sidebar.col .nav-i.on{border-left:none;border-radius:8px;}
    .main{margin-left:var(--sw);min-height:100vh;padding:28px 32px;transition:margin-left .25s;}
    .main.col{margin-left:var(--swc);}
    .head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:20px;gap:16px;flex-wrap:wrap;}
    .title{font-size:22px;font-weight:800;}
    .per{display:flex;border:1px solid var(--border);border-radius:9px;overflow:hidden;}
    .per button{padding:7px 16px;font:600 12px Inter,sans-serif;border:none;background:transparent;color:var(--text-muted);cursor:pointer;}
    .per button.on{background:var(--acc);color:#fff;}
    .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px;}
    .kpi{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 20px;}
    .kpi .v{font-size:30px;font-weight:800;}
    .kpi .l{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted);margin-top:2px;}
    .kpi .s{font-size:12px;color:var(--text-muted);margin-top:6px;}
    .kpi.alerta{border-color:#7f1d1d;background:var(--danger-bg);}
    .kpi.alerta .v{color:var(--danger);}
    .tc{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
    table{width:100%;border-collapse:collapse;table-layout:fixed;}
    th{text-align:left;padding:11px 16px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted);background:var(--bg3);border-bottom:2px solid var(--border);}
    td{padding:14px 16px;font-size:14px;border-top:2px solid var(--border);vertical-align:middle;}
    th.n,td.n{text-align:right;}
    tr.cor{cursor:pointer;}
    tr.cor:hover td{background:var(--bg3);}
    .nome{font-weight:700;}
    .sub{font-size:11px;color:var(--text-muted);margin-top:2px;}
    .red{color:var(--danger);font-weight:800;}
    .pill-red{display:inline-block;background:var(--danger-bg);color:#fca5a5;border:1px solid #7f1d1d;padding:2px 9px;border-radius:50px;font-size:12px;font-weight:700;}
    .muted{color:var(--text-muted);}
    tr.det td{border-top:none;background:var(--bg2);padding:4px 16px 16px 40px;}
    .lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px;}
    .li{display:block;background:var(--card);border:1px solid var(--border);border-radius:9px;padding:10px 12px;font-size:13px;transition:border-color .2s;}
    .li:hover{border-color:var(--acc-dark);}
    .li b{display:block;font-weight:600;}
    .li span{font-size:11px;color:var(--text-muted);}
    .vazio{font-size:12px;color:var(--text-muted);padding:6px 0;}
    .loading{text-align:center;padding:40px;color:var(--text-muted);font-size:13px;}
    .rodape{margin-top:10px;font-size:12px;color:var(--text-muted);text-align:right;}
  </style>
</head>
<body>
<div class="sidebar" id="sb">
  <div class="sb-top">
    <div class="sb-brand">
      <div class="sb-icon">🏠</div>
      <div class="sb-name">CRM <span>Leads</span></div>
    </div>
    <button class="btn-tog" onclick="tog()">☰</button>
  </div>
  <nav class="sb-nav">
    <a class="nav-i" href="crm_dashboard.html"><span class="nav-ic">📊</span><span class="nav-lbl">Dashboard</span></a>
    <a class="nav-i" href="crm_leads.html"><span class="nav-ic">👥</span><span class="nav-lbl">Leads</span></a>
    <a class="nav-i on" id="navAtend" href="crm_atendimento.html"><span class="nav-ic">📈</span><span class="nav-lbl">Atendimento</span></a>
    <a class="nav-i" id="navCorretores" href="crm_corretores.html"><span class="nav-ic">🏢</span><span class="nav-lbl">Corretores</span></a>
    <a class="nav-i" id="navConfig" href="crm_configuracoes.html"><span class="nav-ic">🔧</span><span class="nav-lbl">Configurações</span></a>
  </nav>
  <div style="padding:12px 8px;border-top:1px solid var(--border);">
    <button onclick="logout()" style="display:flex;align-items:center;gap:12px;width:100%;padding:10px;border-radius:8px;background:none;border:none;color:var(--text-muted);font-family:'Inter',sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:all .2s;" onmouseover="this.style.background='var(--bg3)';this.style.color='var(--danger)'" onmouseout="this.style.background='none';this.style.color='var(--text-muted)'">
      <span style="font-size:17px;width:20px;text-align:center;">🚪</span>
      <span class="nav-lbl">Sair</span>
    </button>
  </div>
</div>
<div class="main" id="main">
  <div class="head">
    <div class="title">Atendimento da equipe</div>
    <div class="per" id="per">
      <button data-d="7">7 dias</button><button data-d="30" class="on">30 dias</button><button data-d="90">90 dias</button>
    </div>
  </div>
  <div class="kpis" id="kpis"></div>
  <div class="tc">
    <table>
      <colgroup><col style="width:24%"><col><col><col><col><col><col style="width:15%"></colgroup>
      <thead><tr>
        <th>Corretor</th><th class="n">Recebidos</th><th class="n">Atendidos</th><th class="n">Esperando +48h</th>
        <th class="n">1º contato</th><th class="n">Em andamento parados +7d</th><th class="n">Último acesso</th>
      </tr></thead>
      <tbody id="tbody"><tr><td colspan="7"><div class="loading">Carregando...</div></td></tr></tbody>
    </table>
  </div>
  <div class="rodape" id="rodape"></div>
</div>
<script src="crm_auth.js"></script>
<script>
  // Visão do gestor (mockup aprovado em 06/10). Responde: quem está deixando lead sem atendimento?
  // Atendido = tem contato registrado ou já saiu de "Novo Lead".
  // Esperando +48h = chegou há mais de 48h, ainda em "Novo Lead" e sem registro.
  // 1º contato = mediana entre a chegada e o primeiro registro (só lead com registro).
  // Parados +7d = lead em andamento sem registro nem mudança de fase há 7 dias, na carteira toda.
  const H48=48*3600e3, D7=7*864e5, D14=14*864e5;
  let leads=[],ints=[],fases=[],funis=[],corretores=[],acessos={},dias=30,abertos=new Set(),primeiraVez=true;

  function tog(){document.getElementById('sb').classList.toggle('col');document.getElementById('main').classList.toggle('col');}

  (async()=>{
    await checkAuth();
    if(!(await isAdminCRM())){window.location.href='crm_dashboard.html';return;}
    if(await getCorretorLogado()){
      document.getElementById('navCorretores').style.display='none';
      document.getElementById('navConfig').style.display='none';
    }
    const h=await getHeaders();if(!h)return;
    const g=u=>fetch(`${SB}/rest/v1/${u}`,{headers:h}).then(r=>r.json());
    let ac;
    [leads,ints,fases,funis,corretores,ac]=await Promise.all([
      g('leads?select=id,nome,origem,campanha,corretor_id,fase_id,created_at,fase_atualizada_em'),
      g('interacoes?select=lead_id,created_at'),
      g('fases?select=id,nome,funil_id'),
      g('funis?select=id,nome'),
      g('corretores?select=id,nome&ativo=eq.true&order=nome'),
      fetch(`${SB}/rest/v1/rpc/crm_ultimos_acessos`,{method:'POST',headers:h,body:'{}'}).then(r=>r.json()),
    ]);
    (ac||[]).forEach(a=>acessos[a.corretor_id]=a.ultimo_acesso);
    document.getElementById('per').addEventListener('click',e=>{
      const b=e.target.closest('button');if(!b)return;
      dias=Number(b.dataset.d);
      document.querySelectorAll('#per button').forEach(x=>x.classList.toggle('on',x===b));
      render();
    });
    render();
  })();

  // Datas sem fuso no banco estão em UTC
  function dt(s){if(!s)return null;s=s.replace(' ','T');if(/[+-]\d\d$/.test(s))s+=':00';return new Date(/([zZ]|[+-]\d\d:?\d\d)$/.test(s)?s:s+'Z');}
  function fd(d){return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});}
  function diasAtras(d){return Math.floor((Date.now()-d)/864e5);}
  function fh(h){if(h==null)return'<span class="muted">—</span>';return(h<10?h.toFixed(1).replace('.',','):Math.round(h))+' h';}
  function mediana(a){if(!a.length)return null;a=[...a].sort((x,y)=>x-y);const m=a.length>>1;return a.length%2?a[m]:(a[m-1]+a[m])/2;}
  function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

  function render(){
    const agora=Date.now(), ini=agora-dias*864e5;
    const nomeFase={},emAndamento={};
    const nutricao=new Set(funis.filter(f=>f.nome==='Nutrição').map(f=>f.id));
    fases.forEach(f=>{
      nomeFase[f.id]=f.nome;
      emAndamento[f.id]=!nutricao.has(f.funil_id)&&!['Novo Lead','Descartado','Venda'].includes(f.nome);
    });
    const prim={},ult={};
    ints.forEach(i=>{const t=dt(i.created_at);if(!prim[i.lead_id]||t<prim[i.lead_id])prim[i.lead_id]=t;if(!ult[i.lead_id]||t>ult[i.lead_id])ult[i.lead_id]=t;});
    const atendido=l=>!!prim[l.id]||nomeFase[l.fase_id]!=='Novo Lead';

    const tot={rec:0,at:0,esp:0,horas:[]};
    const linhas=corretores.map(c=>{
      const meus=leads.filter(l=>l.corretor_id===c.id);
      const rec=meus.filter(l=>dt(l.created_at)>=ini);
      const at=rec.filter(atendido);
      const esp=rec.filter(l=>!atendido(l)&&agora-dt(l.created_at)>H48).sort((a,b)=>dt(a.created_at)-dt(b.created_at));
      const horas=rec.filter(l=>prim[l.id]).map(l=>(prim[l.id]-dt(l.created_at))/36e5).filter(h=>h>=0);
      const parados=meus.filter(l=>emAndamento[l.fase_id]&&agora-Math.max(+(ult[l.id]||dt(l.created_at)),+(dt(l.fase_atualizada_em)||0))>D7).length;
      tot.rec+=rec.length;tot.at+=at.length;tot.esp+=esp.length;tot.horas.push(...horas);
      return {c,rec:rec.length,at:at.length,esp,med:mediana(horas),parados,acesso:dt(acessos[c.id])};
    }).filter(r=>r.rec||r.esp.length||r.parados)
      .sort((a,b)=>b.esp.length-a.esp.length||b.rec-a.rec);

    const comReg=tot.horas.length, med=mediana(tot.horas);
    document.getElementById('kpis').innerHTML=`
      <div class="kpi"><div class="v">${tot.rec}</div><div class="l">Leads recebidos</div></div>
      <div class="kpi"><div class="v">${tot.at}</div><div class="l">Atendidos</div><div class="s">${tot.rec?Math.round(tot.at/tot.rec*100):0}% dos recebidos</div></div>
      <div class="kpi${tot.esp?' alerta':''}"><div class="v">${tot.esp}</div><div class="l">Esperando há mais de 48h</div><div class="s">nenhum contato registrado</div></div>
      <div class="kpi"><div class="v">${med==null?'—':fh(med)}</div><div class="l">Tempo até o 1º contato</div><div class="s">mediana · ${comReg} de ${tot.rec} com registro</div></div>`;

    if(primeiraVez&&linhas[0]?.esp.length){abertos.add(linhas[0].c.id);}
    primeiraVez=false;

    const tb=document.getElementById('tbody');
    if(!linhas.length){tb.innerHTML='<tr><td colspan="7"><div class="loading">Nenhum lead no período</div></td></tr>';}
    else tb.innerHTML=linhas.map(r=>{
      const aberto=abertos.has(r.c.id);
      const pct=r.rec?Math.round(r.at/r.rec*100):0;
      const acesso=r.acesso
        ?`<span class="${agora-r.acesso>D14?'red':''}">${fd(r.acesso)}</span><div class="sub">${diasAtras(r.acesso)===0?'hoje':'há '+diasAtras(r.acesso)+' dias'}</div>`
        :'<span class="muted">—</span>';
      let h=`<tr class="cor" onclick="alternar('${r.c.id}')">
        <td><div class="nome">${aberto?'▾':'▸'} ${esc(r.c.nome)}</div></td>
        <td class="n">${r.rec}</td>
        <td class="n">${r.at} <span class="muted">· ${pct}%</span></td>
        <td class="n">${r.esp.length?`<span class="pill-red">${r.esp.length}</span>`:'0'}</td>
        <td class="n">${fh(r.med)}</td>
        <td class="n">${r.parados}</td>
        <td class="n">${acesso}</td></tr>`;
      if(aberto){
        h+=`<tr class="det"><td colspan="7">${r.esp.length?`<div class="lista">${r.esp.map(l=>{
          const d=dt(l.created_at);
          return `<a class="li" href="crm_leads.html?lead=${l.id}"><b>${esc(l.nome||'—')}</b><span>chegou ${fd(d)} · há ${diasAtras(d)} dias${l.origem?' · '+esc(l.origem):''}${l.campanha?' · '+esc(l.campanha):''}</span></a>`;
        }).join('')}</div>`:'<div class="vazio">Nenhum lead esperando há mais de 48h.</div>'}</td></tr>`;
      }
      return h;
    }).join('');
    document.getElementById('rodape').textContent=`${linhas.length} corretor${linhas.length!==1?'es':''}`;
  }

  function alternar(id){abertos.has(id)?abertos.delete(id):abertos.add(id);render();}
</script>
</body>
</html>
